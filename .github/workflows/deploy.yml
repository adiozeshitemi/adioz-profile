name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Cloudflare Workers
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The build reads the GitHub activity live with GITHUB_ACTIVITY_TOKEN;
      # without it, or when the API fails, it uses src/data/activity.json.
      - name: Build
        run: npm run build
        env:
          GITHUB_ACTIVITY_TOKEN: ${{ secrets.GITHUB_ACTIVITY_TOKEN }}

      - name: Deploy to production
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.147.0"
          command: deploy

      # Wrangler reports a workers.dev target as a URL and a Custom Domain
      # target as "<hostname> (custom domain)".
      - name: Write the deployment URL to the run summary
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "::error::Wrangler reported no deployment URL."
            exit 1
          fi
          host="${DEPLOYMENT_URL%% *}"
          echo "**Production:** https://${host#https://}" >> "$GITHUB_STEP_SUMMARY"

  profile-readme:
    name: Update the GitHub profile README
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # PROFILE_README_TOKEN is a fine-grained token with Contents: Read and
      # write on adiozeshitemi/adiozeshitemi only.
      - name: Check out the profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: adiozeshitemi/adiozeshitemi
          token: ${{ secrets.PROFILE_README_TOKEN }}
          path: profile

      - name: Render the README
        run: node scripts/profile-readme.ts profile/README.md

      - name: Push the README when it changed
        working-directory: profile
        run: |
          if git diff --quiet -- README.md; then
            echo "The profile README is unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update the profile README from adioz.dev ${GITHUB_SHA::7}"
          git push
          echo "**Profile README:** updated." >> "$GITHUB_STEP_SUMMARY"
