name: Deploy

on:
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

env:
  WRANGLER_VERSION: "4.147.0"

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Cloudflare Workers
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to production
        id: production
        if: github.ref_name == 'main'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: deploy

      # A preview alias is a DNS label: lowercase letters, digits and dashes,
      # starting with a letter. "<alias>-adioz-dev" must fit in 63 characters,
      # so an alias longer than 53 keeps its first 48 characters and appends
      # the first 4 hex digits of the branch name's SHA-256.
      - name: Derive the preview alias from the branch name
        id: alias
        if: github.ref_name != 'main'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          alias=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g')
          case "$alias" in
            [a-z]*) ;;
            *) alias="branch${alias:+-$alias}" ;;
          esac
          if [ "${#alias}" -gt 53 ]; then
            hash=$(printf '%s' "$BRANCH" | sha256sum | cut -c1-4)
            alias="$(printf '%s' "${alias:0:48}" | sed -E 's/-+$//')-$hash"
          fi
          echo "name=$alias" >> "$GITHUB_OUTPUT"

      - name: Upload a preview version
        id: preview
        if: github.ref_name != 'main'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: versions upload --preview-alias ${{ steps.alias.outputs.name }}

      # The preview step's deployment-url is the version URL,
      # <version>-adioz-dev.<subdomain>.workers.dev; the branch URL swaps the
      # version prefix for the alias.
      - name: Write the deployment URL to the run summary
        env:
          BRANCH: ${{ github.ref_name }}
          ALIAS: ${{ steps.alias.outputs.name }}
          PRODUCTION_URL: ${{ steps.production.outputs.deployment-url }}
          VERSION_URL: ${{ steps.preview.outputs.deployment-url }}
        run: |
          if [ -n "$PRODUCTION_URL" ]; then
            echo "**Production:** $PRODUCTION_URL" >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$VERSION_URL" ]; then
            host="${VERSION_URL#https://}"
            {
              echo "**Preview of \`$BRANCH\`**"
              echo
              echo "- Branch: https://$ALIAS-${host#*-}"
              echo "- This commit: $VERSION_URL"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Wrangler reported no deployment URL."
            exit 1
          fi
